<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 650px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
        }

        .form-container h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            margin: 8px auto 0;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e8ee;
            border-radius: 10px;
            font-size: 15px;
            color: #333;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="number"]:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #ff4b2b;
            background-color: #fff;
            box-shadow: 0 0 12px rgba(255, 75, 43, 0.25);
            transform: translateY(-2px);
        }

        .radio-group {
            display: flex;
            gap: 25px;
            align-items: center;
            margin-top: 8px;
        }

        .radio-group label {
            font-weight: 500;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
        }

        .radio-group label:hover {
            color: #ff4b2b;
        }

        .radio-group input[type="radio"] {
            accent-color: #ff4b2b;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .form-group input[type="file"] {
            padding: 10px;
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-group input[type="file"]:hover {
            border-color: #ff4b2b;
            background-color: #fff5f3;
        }

        .form-group textarea {
            resize: vertical;
            height: 120px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: #ffffff;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.35);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 65, 108, 0.5);
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(30deg);
            transition: all 0.6s ease;
        }

        .btn-submit:hover::after {
            left: 100%;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Student Registration</h2>
        <form action="#" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="fathername">Father's Name</label>
                <input type="text" id="fathername" name="fathername" placeholder="Enter father's name" required>
            </div>

            <div class="form-group">
                <label for="rollno">Roll Number</label>
                <input type="number" id="rollno" name="rollno" placeholder="Enter roll number" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </div>

            <div class="form-group">
                <label for="class">Select Class</label>
                <select id="class" name="class" required>
                    <option value="" disabled selected>Choose your class</option>
                    <option value="9th">Class 9th</option>
                    <option value="10th">Class 10th</option>
                    <option value="11th">Class 11th (1st Year)</option>
                    <option value="12th">Class 12th (2nd Year)</option>
                    <option value="graduation">Graduation / Bachelor's</option>
                </select>
            </div>

            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course" name="course" required>
                    <option value="" disabled selected>Choose your course</option>
                    <option value="web-development">Web Development</option>
                    <option value="graphic-designing">Graphic Designing</option>
                    <option value="python">Python Programming</option>
                    <option value="digital-marketing">Digital Marketing</option>
                    <option value="app-development">Mobile App Development</option>
                </select>
            </div>

            <div class="form-group">
                <label for="photo">Upload Photo</label>
                <input type="file" id="photo" name="photo" accept="image/*" required>
            </div>

            <div class="form-group">
                <label for="message">Message / Address</label>
                <textarea id="message" name="message" placeholder="Type your message or address here..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Register Now</button>

        </form>
    </div>

</body>
</html>
